<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#f4f1ea;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1ea;padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#fffdf9;border:1px solid #e3ddd1;border-radius:14px;">
            <tr>
              <td style="padding:36px 32px 32px;font-family:'Schibsted Grotesk',Helvetica,Arial,sans-serif;color:#1c1915;">
                <div style="font-size:26px;font-weight:700;letter-spacing:-0.6px;margin:0 0 24px;">Cram</div>
                <h1 style="font-size:19px;font-weight:600;margin:0 0 10px;">Confirm your email</h1>
                <p style="font-size:15px;line-height:1.55;color:#6b645a;margin:0 0 26px;">Tap the button below to finish setting up your Cram account. After that you can log in and start making decks.</p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="border-radius:10px;background:#d9480f;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 26px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:10px;">Confirm email</a>
                    </td>
                  </tr>
                </table>
                <p style="font-size:13px;line-height:1.5;color:#6b645a;margin:26px 0 0;">If you didn't sign up for Cram, you can ignore this email.</p>
              </td>
            </tr>
          </table>
          <p style="font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#9a9286;margin:18px 0 0;">appcram.com</p>
        </td>
      </tr>
    </table>
  </body>
</html>
