<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#dce2ea;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#dce2ea;padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:3px;border-top:3px solid #dd3b41;">
            <tr>
              <td style="padding:36px 32px 32px;font-family:'Atkinson Hyperlegible',Helvetica,Arial,sans-serif;color:#16223d;">
                <div style="font-family:'Courier Prime','Courier New',Courier,monospace;font-size:30px;font-weight:700;margin:0 0 24px;">Cram</div>
                <h1 style="font-size:19px;font-weight:600;margin:0 0 10px;">Confirm your email</h1>
                <p style="font-size:15px;line-height:1.55;color:#56627a;margin:0 0 26px;">Tap the button below to finish setting up your Cram account. After that you can log in and start making decks.</p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="border-radius:7px;background:#16223d;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 26px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:7px;">Confirm email</a>
                    </td>
                  </tr>
                </table>
                <p style="font-size:13px;line-height:1.5;color:#56627a;margin:26px 0 0;">If you didn't sign up for Cram, you can ignore this email.</p>
              </td>
            </tr>
          </table>
          <p style="font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#56627a;margin:18px 0 0;">appcram.com</p>
        </td>
      </tr>
    </table>
  </body>
</html>
